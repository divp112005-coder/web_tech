<!DOCTYPE html>
<html lang="en" ng-app="foodOrderApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eats Direct - Online Food Ordering</title>
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Vanilla CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header / Navigation -->
    <header class="navbar">
        <div class="logo">Eats Direct</div>
        <nav ng-controller="NavController">
            <ul>
                <li><a href="#!/menu">Menu</a></li>
                <li ng-if="!isLoggedIn()"><a href="#!/login">Login</a></li>
                <li ng-if="!isLoggedIn()"><a href="#!/register" class="btn btn-outline">Register</a></li>
                <li ng-if="isLoggedIn()"><a href="#!/profile">Welcome, {{ currentUser.first_name }}</a></li>
                <li ng-if="isLoggedIn()"><a href="#!/cart">Cart (<span class="cart-count">{{ cartCount() }}</span>)</a></li>
                <li ng-if="isLoggedIn()"><a href="" ng-click="logout()">Logout</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Area where Views will be injected -->
    <main class="container">
        <div ng-view></div>
    </main>

    <!-- AngularJS 1.x & ngRoute -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>
    
    <!-- App Logic -->
    <script src="js/app.js"></script>

    <!-- ===== INLINE TEMPLATES (bypasses template file caching) ===== -->

    <script type="text/ng-template" id="views/menu.html">
        <div class="menu-header">
            <h2>Our Delicious Menu</h2>
            <p style="color:var(--gray);">Freshly prepared, delivered hot to your door.</p>
            <div class="menu-search-bar">
                <input type="text" id="menuSearch" ng-model="searchQuery"
                       placeholder="Search dishes..." class="menu-search-input" />
            </div>
        </div>

        <div class="alert alert-error" ng-if="categories.length === 0">
            Menu is currently empty or could not be loaded.
        </div>

        <div ng-repeat="cat in categories track by $index">

            <!-- HEADER: always visible, toggles body -->
            <div class="acc-header" ng-click="cat.isOpen = !cat.isOpen">
                <div style="display:flex;align-items:center;gap:12px;">
                    <span style="font-size:1.4rem;">{{ cat.icon }}</span>
                    <strong style="font-size:1.1rem;letter-spacing:-0.2px;">{{ cat.name }}</strong>
                    <span class="acc-badge">{{ (cat.items | filter:searchQuery).length }} items</span>
                </div>
                <span class="acc-arrow" ng-class="{'acc-arrow-open': cat.isOpen}">&#9660;</span>
            </div>

            <!-- BODY: physically removed from DOM when closed -->
            <div class="acc-body" ng-if="cat.isOpen">
                <p ng-if="(cat.items | filter:searchQuery).length === 0"
                   style="color:var(--gray);text-align:center;padding:1rem 0;">
                    No items match "{{ searchQuery }}".
                </p>
                <div class="menu-grid">
                    <div class="menu-card" ng-repeat="item in cat.items | filter:searchQuery track by item.id">
                        <div class="menu-content" style="padding:1.5rem;">
                            <h3 style="font-size:1.05rem;margin-bottom:0.35rem;">{{ item.name }}</h3>
                            <p class="menu-desc">{{ item.description }}</p>
                            <div class="menu-footer" style="margin-top:1rem;">
                                <span class="menu-price">&#8377;{{ item.price | number:2 }}</span>
                                <button class="btn btn-outline" ng-click="addToCart(item)"
                                        id="add-{{ item.id }}">+ Add</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </script>

</body>
</html>
