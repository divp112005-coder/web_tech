<div class="cart-container">
    <h2>Your Cart</h2>

    <div class="alert alert-error" ng-if="cart.length === 0">
        Your cart is currently empty. <a href="#!/menu" style="color: var(--primary);">Go back to the menu!</a>
    </div>

    <div ng-if="cart.length > 0">
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="item in cart">
                    <td>
                        <strong>{{ item.name }}</strong>
                        <div style="font-size: 0.85rem; color: var(--gray);">{{ item.category }}</div>
                    </td>
                    <td>₹{{ item.price | number:2 }}</td>
                    <td>
                        <div class="quantity-control">
                            <button ng-click="updateQuantity(item.id, -1)">-</button>
                            <span>{{ item.quantity }}</span>
                            <button ng-click="updateQuantity(item.id, 1)">+</button>
                        </div>
                    </td>
                    <td>₹{{ (item.price * item.quantity) | number:2 }}</td>
                    <td>
                        <button class="btn btn-danger" style="padding: 0.5rem 1rem;" ng-click="removeItem(item.id)">Remove</button>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="cart-summary">
            <div class="cart-total">Total: <span>₹{{ total | number:2 }}</span></div>
            <button class="btn btn-primary" style="font-size: 1.1rem; padding: 1rem 3rem;" ng-click="checkout()">Place Order</button>
        </div>
    </div>
</div>
