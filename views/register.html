<div class="auth-box">
    <h2>Create an Account</h2>
    <div class="alert alert-error" ng-if="errorMessage">{{ errorMessage }}</div>
    
    <form ng-submit="register()">
        <div class="form-group">
            <label>First Name</label>
            <input type="text" ng-model="regData.first_name" placeholder="John">
        </div>
        <div class="form-group">
            <label>Last Name</label>
            <input type="text" ng-model="regData.last_name" placeholder="Doe">
        </div>
        <div class="form-group">
            <label>Email Directory</label>
            <input type="email" ng-model="regData.email" placeholder="john@example.com">
        </div>
        <div class="form-group">
            <label>Username</label>
            <input type="text" ng-model="regData.username" placeholder="johndoe123">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" ng-model="regData.password" placeholder="Min. 6 characters">
        </div>
        <button type="submit" class="btn btn-success">Register</button>
    </form>
    
    <p style="margin-top: 1rem; color: var(--gray);">
        Already have an account? <a href="#!/login" style="color: var(--primary);">Login</a>.
    </p>
</div>
