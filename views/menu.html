<div class="menu-header">
    <h2>Our Delicious Menu</h2>
    <p style="color: var(--gray);">Freshly prepared, delivered hot to your door.</p>
</div>

<div class="alert alert-error" ng-if="!groupedMenu || (groupedMenu | json) == '{}'">
    Menu is currently empty or loading.
</div>

<div ng-repeat="(category, items) in groupedMenu">
    <h3 class="category-title" style="margin-top: 3rem; margin-bottom: 1.5rem; text-transform: uppercase; color: var(--primary); border-bottom: 2px solid var(--light); padding-bottom: 0.5rem;">{{ category }}</h3>
    
    <div class="menu-grid">
        <div class="menu-card" ng-repeat="item in items">
            <div class="menu-content" style="padding: 2rem 1.5rem;">
                <h3 style="font-size: 1.4rem;">{{ item.name }}</h3>
                <p class="menu-desc">{{ item.description }}</p>
                <div class="menu-footer" style="margin-top: 1.5rem;">
                    <span class="menu-price">₹{{ item.price | number:2 }}</span>
                    <button class="btn btn-outline" ng-click="addToCart(item)">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>
</div>
