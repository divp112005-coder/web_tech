<div class="auth-box">
    <h2>Welcome Back!</h2>
    <div class="alert alert-error" ng-if="errorMessage">{{ errorMessage }}</div>
    
    <form ng-submit="login()">
        <div class="form-group">
            <label>Username</label>
            <input type="text" ng-model="loginData.username" placeholder="Enter your username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" ng-model="loginData.password" placeholder="Enter your password">
        </div>
        <button type="submit" class="btn btn-primary">Login to Order</button>
    </form>
    
    <p style="margin-top: 1rem; color: var(--gray);">
        Don't have an account? <a href="#!/register" style="color: var(--primary);">Register here</a>.
    </p>
</div>
